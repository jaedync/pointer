<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pointer · Scrum Poker</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#2e2320">
<style>
  /* Set background immediately to prevent white flash */
  html { background: #2e2320; }

  /* Self-hosted fonts — block rendering until loaded for zero FOUT */
  @font-face {
    font-family: 'Instrument Sans';
    src: url('/fonts/instrument-sans-latin.woff2') format('woff2');
    font-weight: 400 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Karla';
    src: url('/fonts/karla-latin.woff2') format('woff2');
    font-weight: 400 800;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Recursive';
    src: url('/fonts/recursive-latin.woff2') format('woff2');
    font-weight: 300 800;
    font-style: normal;
    font-display: block;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #faf5f2;
    --surface: #ffffff;
    --header-bg: #2e2320;
    --header-text: #f0e8e2;
    --accent: #d4856a;
    --accent-hover: #c4755a;
    --accent-soft: rgba(212,133,106,0.1);
    --accent-glow: rgba(212,133,106,0.25);
    --text: #3a2e28;
    --text-secondary: #7a6e65;
    --text-muted: #b5a898;
    --border: #e8ddd4;
    --card-face: #fffbf8;
    --waiting: #d4c4b8;
  }

  /* Deterministic player color palette — 12 distinct, warm-friendly colors */
  :root {
    --pc-0: #d4856a; /* terracotta */
    --pc-1: #6aad8c; /* sage */
    --pc-2: #7b8fc7; /* periwinkle */
    --pc-3: #c9a84c; /* gold */
    --pc-4: #b07cc7; /* lavender */
    --pc-5: #c76a6a; /* rose */
    --pc-6: #6ab5c7; /* sky */
    --pc-7: #8aad5c; /* olive */
    --pc-8: #c78a5c; /* amber */
    --pc-9: #6a7ec7; /* slate blue */
    --pc-10: #c76a9a; /* magenta */
    --pc-11: #5cad9a; /* teal */
  }

  body {
    font-family: 'Instrument Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* ═══════════════════════════════════════
     LOBBY / JOIN MODAL OVERLAY
     ═══════════════════════════════════════ */
  .lobby-overlay {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    background: rgba(46, 35, 32, 0.5);
    backdrop-filter: blur(6px);
    opacity: 1;
    transition: opacity 0.3s;
  }
  .lobby-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .lobby-card {
    position: relative;
    z-index: 1;
    width: 440px;
    background: var(--surface);
    border-radius: 24px;
    box-shadow: 0 16px 64px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.08);
    overflow: hidden;
    transform: scale(1) translateY(0);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
  }
  .lobby-overlay.hidden .lobby-card {
    transform: scale(0.95) translateY(10px);
    opacity: 0;
  }

  .lobby-header {
    background: var(--surface);
    padding: 28px 32px 20px;
    text-align: center;
    position: relative;
    border-bottom: 1px solid var(--border);
  }
  .lobby-header::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 4px;
    background: var(--accent);
    border-radius: 24px 24px 0 0;
  }
  .lobby-close {
    position: absolute; top: 16px; right: 16px;
    width: 32px; height: 32px; border-radius: 8px;
    border: none; background: var(--accent-soft);
    color: var(--text-muted); font-size: 18px;
    cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .lobby-close:hover { background: var(--accent-glow); color: var(--accent); }

  .lobby-logo {
    font-family: 'Karla', sans-serif;
    font-size: 26px; font-weight: 800;
    color: var(--text);
    letter-spacing: -0.02em;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 6px;
  }
  .lobby-logo .logo-dot {
    width: 10px; height: 10px;
    background: var(--accent);
    border-radius: 50%;
  }
  .lobby-subtitle {
    font-size: 14px; color: var(--text-muted);
  }

  .lobby-body {
    padding: 32px;
    display: flex; flex-direction: column; gap: 24px;
  }

  .field {
    display: flex; flex-direction: column; gap: 8px;
  }
  .field-label {
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-muted);
  }
  .field-input {
    padding: 12px 16px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--card-face);
    font-family: 'Instrument Sans', sans-serif;
    font-size: 15px; font-weight: 500;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .field-input:focus { border-color: var(--accent); }
  .field-input::placeholder { color: var(--text-muted); }

  .field-select-wrap {
    position: relative;
  }
  .field-select {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--card-face);
    font-family: 'Instrument Sans', sans-serif;
    font-size: 15px; font-weight: 500;
    color: var(--text);
    outline: none;
    appearance: none;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .field-select:focus { border-color: var(--accent); }
  .field-select-arrow {
    position: absolute; right: 16px; top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    color: var(--text-muted);
    font-size: 12px;
  }

  /* Voting system preview chips */
  .system-preview {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-top: 4px;
  }
  .system-chip {
    padding: 4px 10px;
    border-radius: 8px;
    background: var(--accent-soft);
    font-family: 'Recursive', sans-serif;
    font-size: 13px; font-weight: 600;
    color: var(--accent);
    font-variation-settings: 'CASL' 0.3;
  }

  .lobby-btn {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-family: 'Karla', sans-serif;
    font-size: 16px; font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 16px var(--accent-glow);
    position: relative;
    overflow: hidden;
  }
  .lobby-btn::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
    pointer-events: none;
  }
  .lobby-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(212,133,106,0.35);
  }

  /* ═══════════════════════════════════════
     GAME PAGE HEADER
     ═══════════════════════════════════════ */
  .header {
    background: var(--header-bg);
    padding: 0 24px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .logo {
    font-family: 'Karla', sans-serif;
    font-size: 17px; font-weight: 800;
    color: var(--header-text);
    letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 8px;
    cursor: pointer;
  }
  .logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
  .room-name {
    font-size: 13px; color: #c9bcae;
    padding-left: 16px; border-left: 1px solid #4a3e36;
  }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .btn-invite {
    padding: 6px 14px; border-radius: 7px;
    min-width: 100px; text-align: center;
    border: 1px solid #5a4a3e; background: transparent;
    color: #c0aa98; font-family: 'Instrument Sans', sans-serif;
    font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-invite:hover { border-color: var(--accent); color: var(--accent); }
  .invite-group {
    display: flex; align-items: center; gap: 4px;
    padding: 4px;
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .room-code {
    font-family: 'Recursive', sans-serif;
    font-size: 14px; font-weight: 700;
    font-variation-settings: 'CASL' 0.3;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 6px 14px;
    min-width: 118px; text-align: center;
    border-radius: 7px;
    border: none;
    background: transparent;
    cursor: pointer;
    transition: all 0.15s;
  }
  .room-code:hover {
    background: rgba(212,133,106,0.12);
    color: #e8a070;
  }
  .btn-leave {
    padding: 6px 14px; border-radius: 7px;
    border: 1px solid #5a4a3e; background: transparent;
    color: #8a7a6e; font-family: 'Instrument Sans', sans-serif;
    font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-leave:hover { border-color: #c76a6a; color: #c76a6a; }

  /* Countdown overlay — positioned over the stage without displacing content */
  .countdown-overlay {
    position: absolute;
    inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(250, 245, 242, 0.85);
    backdrop-filter: blur(4px);
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .countdown-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .countdown-number {
    font-family: 'Recursive', sans-serif;
    font-size: 96px; font-weight: 800;
    color: var(--accent);
    font-variation-settings: 'CASL' 0.5;
    line-height: 1;
    animation: countdownPop 0.8s ease-out;
  }
  .countdown-label {
    margin-top: 12px;
    font-size: 14px; font-weight: 600;
    color: var(--text-muted);
  }
  @keyframes countdownPop {
    0% { transform: scale(2); opacity: 0; }
    40% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .user-pill {
    display: flex; align-items: center; gap: 8px;
    color: #a0907e; font-size: 13px; font-weight: 500;
  }
  .user-av {
    width: 28px; height: 28px; border-radius: 8px;
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }

  /* ═══════════════════════════════════════
     GAME LAYOUT
     ═══════════════════════════════════════ */
  #app {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }

  .game-main {
    flex: 1;
    display: grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: 1fr auto;
    min-height: 0;
  }

  /* ─── Sidebar ─── */
  .sidebar {
    grid-row: 1 / 3;
    padding: 24px 20px;
    border-right: 1px solid var(--border);
    background: #fff;
    display: flex; flex-direction: column; gap: 4px;
    overflow-y: auto;
  }
  .sidebar-label {
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .player-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 12px;
    transition: background 0.15s; position: relative;
  }
  .player-row:hover { background: #faf5f0; }
  .player-row.is-you { background: var(--accent-soft); }

  .player-avatar {
    width: 38px; height: 38px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Karla', sans-serif;
    font-size: 15px; font-weight: 700; color: #fff;
    flex-shrink: 0; position: relative;
  }
  /* Color picker dot */
  .player-avatar .color-edit {
    position: absolute; bottom: -2px; right: -2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--border);
    display: none; align-items: center; justify-content: center;
    cursor: pointer; font-size: 8px; color: var(--text-muted);
  }
  .player-row.is-you .color-edit { display: flex; }

  .player-info { flex: 1; min-width: 0; }
  .player-name-text {
    font-size: 14px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .player-role { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

  .player-vote-indicator {
    width: 28px; height: 38px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.3s; position: relative;
  }
  .player-vote-indicator.voted { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  /* Voted = a face-down card: player-colour fill with a hairline inset frame,
     mirroring the stage card front. Reads as "card placed" without a glyph. */
  .player-vote-indicator.voted::after {
    content: ''; position: absolute; inset: 4px;
    border: 1.5px solid rgba(255,255,255,0.45); border-radius: 3px;
  }
  .player-vote-indicator.waiting {
    background: #f0e8e0; border: 1.5px dashed #d4c8ba;
  }
  .player-vote-indicator.revealed-vote {
    background: var(--card-face); border: 2px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .player-vote-indicator.revealed-vote .vi-val {
    font-family: 'Recursive', sans-serif;
    font-weight: 700; font-size: 15px; color: var(--text);
    font-variation-settings: 'CASL' 0.3;
  }

  .players-divider { height: 1px; background: var(--border); margin: 10px 0; }

  /* ─── Consensus Tracker ─── */
  .consensus-tracker {
    margin-top: auto;
    padding: 18px;
    background: #faf5f0;
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .consensus-ring {
    width: 56px; height: 56px;
    position: relative;
    flex-shrink: 0;
  }
  .consensus-ring svg {
    width: 56px; height: 56px;
    transform: rotate(-90deg);
  }
  .consensus-ring .ring-bg {
    fill: none;
    stroke: #e8ddd4;
    stroke-width: 5;
  }
  .consensus-ring .ring-fill {
    fill: none;
    stroke: var(--accent);
    stroke-width: 5;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .consensus-ring .ring-label {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .consensus-ring .ring-num {
    font-family: 'Recursive', sans-serif;
    font-size: 16px; font-weight: 800;
    color: var(--accent);
    font-variation-settings: 'CASL' 0.3;
    line-height: 1;
  }
  .consensus-ring .ring-den {
    font-size: 9px; font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }
  .consensus-info {
    flex: 1;
  }
  .consensus-title {
    font-size: 13px; font-weight: 700; color: var(--text);
    margin-bottom: 2px;
  }
  .consensus-desc {
    font-size: 11px; color: var(--text-muted); line-height: 1.4;
  }

  /* ─── Stage ─── */
  .stage {
    display: block;
    min-height: 360px;
    padding: 48px 32px; position: relative; overflow: hidden;
  }
  .stage-top {
    position: absolute; left: 0; right: 0;
    top: 32px;
    display: flex; justify-content: center;
    z-index: 1;
  }
  .stage::before {
    content: ''; position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23d4c8ba' fill-opacity='0.07'%3E%3Ccircle cx='20' cy='20' r='1'/%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none;
  }

  .stage-status {
    font-family: 'Karla', sans-serif;
    font-size: 13px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--text-muted);
    position: relative; z-index: 1;
  }
  .stage-status .count { color: var(--accent); }

  .stage-cards {
    position: absolute; top: 50%; left: 0; right: 0;
    transform: translateY(-50%);
    display: flex; gap: 16px;
    row-gap: 24px;
    flex-wrap: wrap;
    align-items: flex-end; justify-content: center;
    z-index: 1;
  }
  .stage-card {
    width: 80px; height: 112px;
    perspective: 800px; position: relative;
    flex-shrink: 0;
    opacity: 0; animation: cardIn 0.4s ease-out forwards;
  }
  .stage-card:nth-child(1) { animation-delay: 0s; }
  .stage-card:nth-child(2) { animation-delay: 0.06s; }
  .stage-card:nth-child(3) { animation-delay: 0.12s; }
  .stage-card:nth-child(4) { animation-delay: 0.18s; }
  .stage-card:nth-child(5) { animation-delay: 0.24s; }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .stage-card-inner {
    width: 100%; height: 100%; border-radius: 14px;
    transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-style: preserve-3d; position: relative;
  }
  .stage-card-inner.flip { transform: rotateY(180deg); }
  .stage-card-front, .stage-card-back {
    position: absolute; width: 100%; height: 100%; border-radius: 14px;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .stage-card-front {
    box-shadow: 0 4px 20px rgba(0,0,0,0.1), 0 1px 3px rgba(0,0,0,0.06);
    overflow: hidden;
    z-index: 2;
  }
  .stage-card-front::after {
    content: ''; position: absolute; inset: 6px;
    border: 1.5px solid rgba(255,255,255,0.2);
    border-radius: 10px;
  }
  .stage-card-front .sc-init {
    font-family: 'Karla', sans-serif;
    font-size: 22px; font-weight: 800;
    color: rgba(255,255,255,0.9);
    position: relative; z-index: 1;
  }
  .stage-card-front.sc-waiting {
    background: var(--waiting) !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .stage-card-front.sc-waiting::after { border-color: rgba(255,255,255,0.15); }
  .stage-card-front.sc-waiting .sc-init {
    color: rgba(255,255,255,0.5); font-size: 24px;
  }
  .stage-card-back {
    background: var(--card-face);
    border: 2px solid var(--border);
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    transform: rotateY(180deg);
    flex-direction: column;
    align-items: stretch;
    overflow: hidden;
  }
  .stage-card-back.match {
    border-color: #6aad8c;
    box-shadow: 0 0 0 2.5px #6aad8c, 0 4px 12px rgba(106,173,140,0.30);
  }
  .stage-card-back .sc-inlay {
    position: absolute; inset: 5px;
    border: 1.5px solid currentColor;
    border-radius: 9px;
    opacity: 0.3;
    pointer-events: none;
  }
  .stage-card-back .sc-val-area {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding-top: 5px;
  }
  .stage-card-back .sc-value {
    font-family: 'Recursive', sans-serif;
    font-size: 42px; font-weight: 800;
    color: var(--text);
    font-variation-settings: 'CASL' 0.5;
    line-height: 1;
  }
  .stage-card-back .sc-name-bar {
    height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 0 0 12px 12px;
    padding: 0 8px;
  }
  .stage-card-back .sc-name {
    font-size: 14px; font-weight: 700;
    color: rgba(255,255,255,0.95);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 100%;
  }

  .stage-action {
    position: absolute; left: 0; right: 0;
    bottom: 32px;
    z-index: 1;
    display: flex; justify-content: center;
  }
  .btn-reveal {
    padding: 14px 44px; border-radius: 14px; border: none;
    background: var(--accent); color: #fff;
    font-family: 'Karla', sans-serif;
    font-size: 15px; font-weight: 800;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 20px var(--accent-glow);
    position: relative; overflow: hidden;
  }
  .btn-reveal::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
    pointer-events: none;
  }
  .btn-reveal:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 28px rgba(212,133,106,0.35);
  }
  .btn-reveal.all-in { animation: revealPulse 2s ease-in-out infinite; }
  @keyframes revealPulse {
    0%, 100% { box-shadow: 0 4px 20px var(--accent-glow); }
    50% { box-shadow: 0 4px 36px rgba(212,133,106,0.45); }
  }
  .btn-new-round {
    padding: 14px 44px; border-radius: 14px;
    border: 2px solid var(--border); background: var(--surface);
    color: var(--text); font-family: 'Karla', sans-serif;
    font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-new-round:hover { border-color: var(--accent); color: var(--accent); }

  /* ─── Results: consensus pill ─── */
  /* Hidden state is display:none so the pill occupies no layout width while
     voting — otherwise its stale width pushes #stage-status off-center. */
  .consensus-pill { display: none; }
  .consensus-pill.show { display: inline-flex; }
  .cpill {
    display: inline-flex; align-items: center; gap: 12px;
    border-radius: 999px; padding: 8px 14px 8px 22px;
  }
  .cpill-real { background: var(--accent); box-shadow: 0 6px 20px var(--accent-glow); }
  .cpill-good { background: #6aad8c; box-shadow: 0 6px 20px rgba(106,173,140,0.34); }
  .cpill-none { background: var(--waiting); box-shadow: 0 6px 18px rgba(181,168,152,0.3); }
  .cpill-label {
    font-family: 'Karla', sans-serif;
    font-size: 11px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.13em;
    color: rgba(255,255,255,0.85);
  }
  .cpill-val {
    font-family: 'Recursive', sans-serif;
    font-weight: 800; font-size: 25px; color: #fff; line-height: 1;
    background: rgba(255,255,255,0.16); border-radius: 999px;
    min-width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 11px;
  }
  .cpill-dash { color: rgba(255,255,255,0.7); }

  /* ─── Hand ─── */
  .hand {
    grid-column: 2;
    padding: 20px 32px 24px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .hand-label {
    position: absolute; left: 24px; top: 50%;
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-muted);
    writing-mode: vertical-rl;
    transform: translateY(-50%) rotate(180deg);
  }
  .hand-cards {
    display: flex; justify-content: center;
    padding: 0 40px; position: relative;
  }
  .hand-card {
    width: 62px; height: 86px; border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--card-face);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Recursive', sans-serif;
    font-size: 20px; font-weight: 700;
    font-variation-settings: 'CASL' 0.4;
    color: var(--text-secondary);
    cursor: pointer; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    user-select: none; position: relative; margin: 0 -3px;
    transform-origin: bottom center;
  }
  .hand-card:nth-child(1) { transform: rotate(-10deg); z-index: 1; }
  .hand-card:nth-child(2) { transform: rotate(-6deg); z-index: 2; }
  .hand-card:nth-child(3) { transform: rotate(-2deg); z-index: 3; }
  .hand-card:nth-child(4) { transform: rotate(2deg); z-index: 4; }
  .hand-card:nth-child(5) { transform: rotate(6deg); z-index: 5; }
  .hand-card:nth-child(6) { transform: rotate(10deg); z-index: 6; }
  .hand-card:nth-child(7) { transform: rotate(14deg); z-index: 7; }
  .hand-card:nth-child(8) { transform: rotate(18deg); z-index: 8; }
  .hand-card:nth-child(9) { transform: rotate(22deg); z-index: 9; }

  /* Invisible hit area at the card's lower edge to prevent hover jitter when
     the card lifts. Anchored inside the card footprint (bottom: 0) so it does
     not overhang the .hand container and add vertical scroll overflow. */
  .hand-card::after {
    content: '';
    position: absolute;
    left: -4px; right: -4px;
    bottom: 0;
    height: 24px;
  }
  .hand-card:hover {
    border-color: var(--accent); color: var(--accent);
    z-index: 20 !important;
    transform: rotate(0deg) translateY(-18px) scale(1.08) !important;
    box-shadow: 0 8px 24px var(--accent-glow);
  }
  .hand-card.picked {
    border-color: var(--accent);
    background: var(--accent); color: #fff;
    z-index: 20 !important;
    transform: rotate(0deg) translateY(-22px) scale(1.1) !important;
    box-shadow: 0 10px 32px rgba(212,133,106,0.35);
  }
  /* Locked hand — disable hover/click while votes are revealed */
  .hand-locked {
    pointer-events: none;
    opacity: 0.5;
  }
  .hand-locked .hand-card:hover {
    transform: none !important;
    border-color: var(--border) !important;
    color: var(--text-secondary) !important;
    box-shadow: none !important;
  }

  /* Stage hint text for non-host players */
  .stage-hint {
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
  }

  /* ─── Color picker popover ─── */
  .color-picker-popover {
    display: none;
    position: absolute; z-index: 30;
    left: 50px; top: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    gap: 6px;
    flex-wrap: wrap;
    width: 156px;
  }
  .color-picker-popover.show { display: flex; }
  .color-swatch {
    width: 28px; height: 28px; border-radius: 8px;
    cursor: pointer; transition: all 0.12s;
    border: 2px solid transparent;
  }
  .color-swatch:hover { transform: scale(1.15); }
  .color-swatch.active { border-color: var(--text); }

  /* ─── Landing Page: The Table ─── */
  .landing {
    background: var(--header-bg);
    color: var(--header-text);
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative; z-index: 1;
    position: relative;
    overflow: hidden;
  }
  .landing:not(.active) { display: none; }
  #app:not(.active) { display: none; }

  /* Felt texture */
  .landing::before {
    content: ''; position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Ccircle cx='20' cy='20' r='1'/%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none;
  }
  /* Soft radial glow like a lamp over the table */
  .landing::after {
    content: ''; position: absolute;
    top: -20%; left: 50%; transform: translateX(-50%);
    width: 120%; height: 70%;
    background: radial-gradient(ellipse, rgba(212,133,106,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .landing-content {
    position: relative; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 40px 24px;
  }
  .landing-logo {
    font-family: 'Karla', sans-serif;
    font-size: 48px; font-weight: 800;
    color: #f0e8e2;
    letter-spacing: -0.03em;
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 8px;
  }
  .landing-logo .dot {
    width: 14px; height: 14px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 20px rgba(212,133,106,0.4);
  }
  .landing-tagline {
    font-size: 16px;
    color: #8a7a6e;
    margin-bottom: 48px;
  }

  /* Fanned hero cards */
  .landing-hero-cards {
    display: flex; justify-content: center;
    margin-bottom: 48px;
    position: relative;
    height: 140px; width: 340px;
  }
  .landing-hero-card {
    width: 72px; height: 100px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Recursive', sans-serif;
    font-weight: 800;
    font-variation-settings: 'CASL' 0.5;
    font-size: 24px;
    color: rgba(255,255,255,0.9);
    position: absolute;
    bottom: 0; left: 50%;
    transform-origin: bottom center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    opacity: 0;
    animation: heroCardDeal 0.6s ease-out forwards;
  }
  .landing-hero-card::after {
    content: ''; position: absolute; inset: 5px;
    border: 1.5px solid rgba(255,255,255,0.15);
    border-radius: 8px;
  }
  .landing-hero-card:nth-child(1) { transform: translateX(-50%) rotate(-20deg); animation-delay: 0.1s; z-index: 1; }
  .landing-hero-card:nth-child(2) { transform: translateX(-50%) rotate(-10deg); animation-delay: 0.2s; z-index: 2; }
  .landing-hero-card:nth-child(3) { transform: translateX(-50%) rotate(0deg); animation-delay: 0.3s; z-index: 3; }
  .landing-hero-card:nth-child(4) { transform: translateX(-50%) rotate(10deg); animation-delay: 0.4s; z-index: 4; }
  .landing-hero-card:nth-child(5) { transform: translateX(-50%) rotate(20deg); animation-delay: 0.5s; z-index: 5; }

  @keyframes heroCardDeal {
    0% { opacity: 0; transform: translateX(-50%) rotate(0deg) translateY(30px) scale(0.7); }
    100% { opacity: 1; }
  }

  .landing-actions {
    display: flex; flex-direction: column;
    gap: 16px; width: 320px;
  }
  .landing-btn-primary {
    width: 100%; padding: 16px 24px;
    border-radius: 14px; border: none;
    background: var(--accent); color: #fff;
    font-family: 'Karla', sans-serif;
    font-size: 16px; font-weight: 800;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 24px rgba(212,133,106,0.35);
    position: relative; overflow: hidden;
  }
  .landing-btn-primary::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
    pointer-events: none;
  }
  .landing-btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 32px rgba(212,133,106,0.45);
  }
  .landing-divider {
    display: flex; align-items: center; gap: 16px;
    color: #6a5e54; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .landing-divider::before, .landing-divider::after {
    content: ''; flex: 1; height: 1px;
    background: rgba(255,255,255,0.08);
  }
  .landing-join-row { display: flex; gap: 8px; }
  .landing-code-input {
    flex: 1; padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    font-family: 'Recursive', sans-serif;
    font-size: 16px; font-weight: 600;
    font-variation-settings: 'CASL' 0.3;
    color: #f0e8e2;
    text-align: center;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    outline: none;
    transition: border-color 0.15s;
  }
  .landing-code-input::placeholder {
    color: #6a5e54; letter-spacing: 0.05em;
    text-transform: none; font-variation-settings: 'CASL' 0;
  }
  .landing-code-input:focus { border-color: var(--accent); }
  .landing-btn-join {
    padding: 14px 24px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    color: #c0aa98;
    font-family: 'Karla', sans-serif;
    font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
  }
  .landing-btn-join:hover { border-color: var(--accent); color: var(--accent); }

  .landing-footer {
    position: absolute; bottom: 24px;
    font-size: 12px; color: #5a4e44;
    z-index: 2;
  }

  /* ─── Toast notification ─── */
  .toast {
    position: fixed;
    top: 64px; left: 50%;
    transform: translateX(-50%) translateY(-10px);
    padding: 10px 24px;
    border-radius: 10px;
    background: var(--header-bg);
    color: var(--header-text);
    font-size: 13px; font-weight: 600;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    z-index: 80;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ─── Responsive: Mobile ─── */
  @media (max-width: 768px) {
    .game-main {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr auto;
    }
    .sidebar {
      grid-row: auto;
      flex-direction: row;
      flex-wrap: wrap;
      padding: 12px 16px;
      border-right: none;
      border-bottom: 1px solid var(--border);
      gap: 8px;
      overflow-y: visible;
    }
    .sidebar-label { width: 100%; margin-bottom: 4px; }
    .players-divider { display: none; }
    .consensus-tracker { display: none; }
    .hand-cards {
      overflow-x: auto;
      flex-wrap: nowrap;
      padding: 8px 16px;
      justify-content: flex-start;
    }
    .hand-card:nth-child(n) { transform: none; }
    .hand-card:hover {
      transform: translateY(-8px) scale(1.06) !important;
    }
    .hand-card.picked {
      transform: translateY(-10px) scale(1.08) !important;
    }
    .stage-card { width: 60px; height: 84px; }
    .stage-card-back .sc-value { font-size: 30px; }
    .stage-card-back .sc-name { font-size: 11px; }
    .stage-card-back .sc-name-bar { height: 28px; }
    .lobby-card { width: calc(100% - 32px); margin: 16px; }
    .landing-logo { font-size: 36px; }
    .landing-hero-cards { width: 280px; height: 120px; }
    .landing-hero-card { width: 56px; height: 78px; font-size: 18px; }
    .landing-actions { width: 100%; max-width: 320px; }
  }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════
     LANDING PAGE: The Table
     ═══════════════════════════════════════ -->
<div class="landing active" id="landing">
  <div class="landing-content">
    <div class="landing-logo">Pointer<span class="dot"></span></div>
    <div class="landing-tagline">Estimation made simple</div>

    <div class="landing-hero-cards">
      <div class="landing-hero-card" style="background:var(--pc-0)">XS</div>
      <div class="landing-hero-card" style="background:var(--pc-1)">S</div>
      <div class="landing-hero-card" style="background:var(--pc-2)">M</div>
      <div class="landing-hero-card" style="background:var(--pc-3)">L</div>
      <div class="landing-hero-card" style="background:var(--pc-4)">XL</div>
    </div>

    <div class="landing-actions">
      <button class="landing-btn-primary" onclick="showLobbyModal()">Start a new game</button>
      <div class="landing-divider">or join one</div>
      <div class="landing-join-row">
        <input class="landing-code-input" id="landing-room-code" type="text" placeholder="Room code" maxlength="5" onkeydown="if(event.key==='Enter') joinFromLanding()">
        <button class="landing-btn-join" onclick="joinFromLanding()">Join</button>
      </div>
    </div>
  </div>

  <div class="landing-footer">Free forever · No accounts · No tracking</div>
</div>

<!-- ═══════════════════════════════════════
     GAME APP
     ═══════════════════════════════════════ -->
<div id="app">
  <div class="header">
    <div class="header-left">
      <div class="logo">Pointer<span class="logo-dot"></span></div>
      <span class="room-name" id="room-name-display">Waiting...</span>
    </div>
    <div class="header-right">
      <div class="invite-group">
        <button class="room-code" id="room-code-display" onclick="copyRoomCode()" title="Click to copy room code">—</button>
        <button class="btn-invite" id="btn-copy-link" onclick="copyInviteLink()">Copy link</button>
      </div>
      <button class="btn-leave" onclick="leaveRoom()">Leave</button>
    </div>
  </div>

  <div class="game-main">
    <div class="sidebar">
      <div class="sidebar-label" id="players-count">Players · 0</div>
      <div id="players-list"></div>
      <div class="players-divider"></div>

      <!-- Consensus Tracker -->
      <div class="consensus-tracker">
        <div class="consensus-ring">
          <svg viewBox="0 0 56 56">
            <circle class="ring-bg" cx="28" cy="28" r="22"/>
            <!-- circumference = 2π×22 ≈ 138.23; full dashoffset = 138.23 (empty) -->
            <circle class="ring-fill" id="consensus-ring-fill" cx="28" cy="28" r="22"
              stroke-dasharray="138.23"
              stroke-dashoffset="138.23"/>
          </svg>
          <div class="ring-label">
            <span class="ring-num" id="consensus-num">0</span>
            <span class="ring-den" id="consensus-den">of 0</span>
          </div>
        </div>
        <div class="consensus-info">
          <div class="consensus-title">Consensus rounds</div>
          <div class="consensus-desc" id="consensus-desc">No rounds played yet</div>
        </div>
      </div>
    </div>

    <div class="stage">
      <div class="stage-top">
        <div class="stage-status" id="stage-status">Waiting for players...</div>
        <div class="consensus-pill" id="consensus-pill"></div>
      </div>
      <div class="stage-cards" id="stage-cards"></div>
      <div class="stage-action" id="stage-action"></div>
    </div>

    <div class="hand">
      <span class="hand-label">Your hand</span>
      <div class="hand-cards" id="hand-cards">
        <div class="hand-card">XS</div>
        <div class="hand-card">S</div>
        <div class="hand-card">M</div>
        <div class="hand-card">L</div>
        <div class="hand-card">XL</div>
        <div class="hand-card">?</div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════
     LOBBY MODAL (Create Game)
     Placed after landing + app so it paints on top
     ═══════════════════════════════════════ -->
<div class="lobby-overlay hidden" id="lobby-overlay">
  <div class="lobby-card">
    <div class="lobby-header">
      <button class="lobby-close" onclick="hideModals()">&times;</button>
      <div class="lobby-logo">Pointer<span class="logo-dot"></span></div>
      <div class="lobby-subtitle">Free, fast scrum poker for your team</div>
    </div>
    <div class="lobby-body">
      <div class="field">
        <label class="field-label">Game name</label>
        <input class="field-input" id="lobby-game-name" type="text" placeholder="e.g. Sprint 42 Planning" onkeydown="if(event.key==='Enter') createGame()">
      </div>
      <div class="field">
        <label class="field-label">Your name</label>
        <input class="field-input" id="lobby-player-name" type="text" placeholder="e.g. Your name" onkeydown="if(event.key==='Enter') createGame()">
      </div>
      <div class="field">
        <label class="field-label">Voting system</label>
        <div class="field-select-wrap">
          <select class="field-select" id="lobby-voting-system" onchange="updateVotingPreview()">
            <option value="tshirt" selected>T-Shirt Sizes</option>
            <option value="fib">Fibonacci</option>
            <option value="powers">Powers of 2</option>
            <option value="simple">Simple (1–5)</option>
          </select>
          <span class="field-select-arrow">▾</span>
        </div>
        <div class="system-preview" id="system-preview">
          <span class="system-chip">XS</span>
          <span class="system-chip">S</span>
          <span class="system-chip">M</span>
          <span class="system-chip">L</span>
          <span class="system-chip">XL</span>
          <span class="system-chip">?</span>
        </div>
      </div>
      <button class="lobby-btn" id="btn-create-game" onclick="createGame()">Create Game</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════
     JOIN MODAL (Join existing game)
     ═══════════════════════════════════════ -->
<div class="lobby-overlay hidden" id="join-overlay">
  <div class="lobby-card">
    <div class="lobby-header">
      <div class="lobby-logo">Pointer<span class="logo-dot"></span></div>
      <div class="lobby-subtitle">Join a game</div>
    </div>
    <div class="lobby-body">
      <div class="field">
        <label class="field-label">Your name</label>
        <input class="field-input" id="join-player-name" type="text" placeholder="e.g. Your name" onkeydown="if(event.key==='Enter') joinGame()">
      </div>
      <div id="join-error" style="display:none; padding:10px 14px; border-radius:10px; background:#fdecea; color:#c0392b; font-size:13px; font-weight:500;"></div>
      <button class="lobby-btn" id="btn-join-game" onclick="joinGame()">Join Game</button>
    </div>
  </div>
</div>

<script>
  // ─── Constants ───────────────────────────────────────────────────────────────
  const VOTING_SYSTEMS = {
    tshirt: ['XS', 'S', 'M', 'L', 'XL', '?'],
    fib: ['0', '1', '2', '3', '5', '8', '13', '21', '?'],
    powers: ['1', '2', '4', '8', '16', '32', '?'],
    simple: ['1', '2', '3', '4', '5', '?'],
  };
  const COLORS = ['#d4856a','#6aad8c','#7b8fc7','#c9a84c','#b07cc7','#c76a6a','#6ab5c7','#8aad5c','#c78a5c','#6a7ec7','#c76a9a','#5cad9a'];

  // ─── State + WebSocket ────────────────────────────────────────────────────────
  const state = {
    connected: false,
    playerId: null,
    room: null,
    myVote: null,
    wasHost: false,
  };

  let ws = null;
  let reconnectTimer = null;

  function connect() {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${protocol}//${location.host}`);
    ws.onopen = () => {
      state.connected = true;
      if (state.room) {
        send({ type: 'join-room', roomId: state.room.id, playerName: getMyName() });
      }
    };
    ws.onmessage = (e) => handleMessage(JSON.parse(e.data));
    ws.onclose = () => {
      state.connected = false;
      reconnectTimer = setTimeout(connect, 2000);
    };
  }

  function send(msg) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
  }

  function getMyName() {
    if (!state.room || !state.playerId) return '';
    const me = state.room.players.find(p => p.id === state.playerId);
    return me ? me.name : '';
  }

  // ─── Message Handler ──────────────────────────────────────────────────────────
  function handleMessage(msg) {
    switch (msg.type) {
      case 'room-created':
        state.playerId = msg.playerId;
        state.wasHost = true; // creator is host, don't toast
        history.pushState(null, '', `/${msg.roomId}`);
        hideModals();
        showGame();
        break;
      case 'joined':
        state.playerId = msg.playerId;
        history.pushState(null, '', `/${msg.roomId}`);
        hideModals();
        showGame();
        break;
      case 'room-state': {
        const wasRevealed = state.room?.revealed;
        state.room = msg.room;
        if (wasRevealed && !msg.room.revealed) state.myVote = null;
        render();
        break;
      }
      case 'countdown': {
        state.countdown = msg.seconds;
        state.countdownBy = msg.initiatedBy;
        renderCountdown();
        let t = msg.seconds - 1;
        const interval = setInterval(() => {
          if (t <= 0) {
            clearInterval(interval);
            state.countdown = null;
            state.countdownBy = null;
            renderCountdown();
            return;
          }
          state.countdown = t;
          renderCountdown();
          t--;
        }, 1000);
        break;
      }
      case 'error': {
        const joinOverlay = document.getElementById('join-overlay');
        if (!joinOverlay.classList.contains('hidden')) {
          const errEl = document.getElementById('join-error');
          errEl.textContent = msg.message;
          errEl.style.display = 'block';
        } else {
          alert(msg.message);
        }
        break;
      }
    }
  }

  // ─── View Switching ──────────────────────────────────────────────────────────
  function showLanding() {
    document.getElementById('landing').classList.add('active');
    document.getElementById('app').classList.remove('active');
    hideModals();
    updatePageTitle();
  }
  function showGame() {
    document.getElementById('landing').classList.remove('active');
    document.getElementById('app').classList.add('active');
  }

  // ─── Modal Functions ──────────────────────────────────────────────────────────
  function showLobbyModal() {
    document.getElementById('lobby-overlay').classList.remove('hidden');
    document.getElementById('join-overlay').classList.add('hidden');
    document.getElementById('landing').style.pointerEvents = 'none';
  }
  function showJoinModal(roomId) {
    document.getElementById('join-overlay').classList.remove('hidden');
    document.getElementById('lobby-overlay').classList.add('hidden');
    document.getElementById('join-overlay').dataset.roomId = roomId;
    document.getElementById('landing').style.pointerEvents = 'none';
  }
  function hideModals() {
    document.getElementById('lobby-overlay').classList.add('hidden');
    document.getElementById('join-overlay').classList.add('hidden');
    document.getElementById('landing').style.pointerEvents = '';
  }
  function joinFromLanding() {
    const code = document.getElementById('landing-room-code').value.trim().toLowerCase();
    if (!code) { document.getElementById('landing-room-code').focus(); return; }
    navigate(`/${code}`);
  }
  function savePlayerName(name) {
    try { localStorage.setItem('pointer-player-name', name); } catch {}
  }
  function getSavedPlayerName() {
    try { return localStorage.getItem('pointer-player-name') || ''; } catch { return ''; }
  }
  function prefillPlayerName() {
    const saved = getSavedPlayerName();
    if (saved) {
      document.getElementById('lobby-player-name').value = saved;
      document.getElementById('join-player-name').value = saved;
    }
  }
  function createGame() {
    const name = document.getElementById('lobby-game-name').value.trim();
    const playerName = document.getElementById('lobby-player-name').value.trim();
    const votingSystem = document.getElementById('lobby-voting-system').value;
    if (!playerName) { document.getElementById('lobby-player-name').focus(); return; }
    savePlayerName(playerName);
    send({ type: 'create-room', name: name || 'Planning Poker', playerName, votingSystem });
  }
  function joinGame() {
    const playerName = document.getElementById('join-player-name').value.trim();
    const roomId = document.getElementById('join-overlay').dataset.roomId;
    if (!playerName) { document.getElementById('join-player-name').focus(); return; }
    savePlayerName(playerName);
    send({ type: 'join-room', roomId, playerName });
  }
  function updateVotingPreview() {
    const sel = document.getElementById('lobby-voting-system');
    const preview = document.getElementById('system-preview');
    preview.innerHTML = VOTING_SYSTEMS[sel.value].map(v => `<span class="system-chip">${v}</span>`).join('');
  }

  // ─── Render Functions ─────────────────────────────────────────────────────────
  function render() {
    if (!state.room) return;

    // Detect host promotion
    const me = state.room.players.find(p => p.id === state.playerId);
    if (me && me.isHost && !state.wasHost) {
      showToast('You are now the host');
    }
    state.wasHost = me?.isHost || false;

    // Clear countdown overlay when reveal arrives
    if (state.room.revealed) {
      state.countdown = null;
      state.countdownBy = null;
      renderCountdown();
    }
    renderHeader();
    renderSidebar();
    renderStage();
    renderHand();
    updatePageTitle();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function updatePageTitle() {
    if (state.room && document.getElementById('app').classList.contains('active')) {
      document.title = `${state.room.name} · Pointer`;
    } else {
      document.title = 'Pointer · Scrum Poker';
    }
  }

  function renderHeader() {
    document.getElementById('room-name-display').textContent = state.room.name;
    document.getElementById('room-code-display').textContent = state.room.id;
    const me = state.room.players.find(p => p.id === state.playerId);
    if (me) {
    }
  }

  function renderSidebar() {
    const container = document.getElementById('players-list');
    container.innerHTML = state.room.players.map(p => {
      const isMe = p.id === state.playerId;
      const color = COLORS[p.color];
      let indicator = '';
      if (state.room.revealed && p.vote) {
        indicator = `<div class="player-vote-indicator revealed-vote"><span class="vi-val">${escapeHtml(String(p.vote))}</span></div>`;
      } else if (p.vote === 'voted') {
        indicator = `<div class="player-vote-indicator voted" style="background:${color}"></div>`;
      } else {
        indicator = `<div class="player-vote-indicator waiting"></div>`;
      }
      const roleText = isMe ? (p.isHost ? 'Host · You' : 'You') : '';
      const colorSwatches = isMe ? COLORS.map((c, i) => `<div class="color-swatch ${i === p.color ? 'active' : ''}" style="background:${c}" onclick="changeColor(${i});toggleColorPicker(event)"></div>`).join('') : '';
      const colorPicker = isMe ? `<div class="color-edit" onclick="toggleColorPicker(event)" title="Change color">●</div><div class="color-picker-popover" id="color-picker-popover">${colorSwatches}</div>` : '';
      return `
        <div class="player-row ${isMe ? 'is-you' : ''}">
          <div class="player-avatar" style="background:${color}">${p.name[0].toUpperCase()}${colorPicker}</div>
          <div class="player-info">
            <div class="player-name-text">${escapeHtml(p.name)}</div>
            ${roleText ? `<div class="player-role">${roleText}</div>` : ''}
          </div>
          ${indicator}
        </div>
      `;
    }).join('');
    document.getElementById('players-count').textContent = `Players · ${state.room.players.length}`;
    renderConsensus();
  }

  function renderConsensus() {
    const total = state.room.roundNumber;
    const consensus = state.room.consensusCount;
    const circumference = 2 * Math.PI * 22;
    document.getElementById('consensus-num').textContent = consensus;
    document.getElementById('consensus-den').textContent = `of ${total}`;
    document.getElementById('consensus-desc').textContent =
      total === 0 ? 'No rounds played yet' : `${consensus} of ${total} rounds reached agreement`;
    const pct = total === 0 ? 0 : consensus / total;
    document.getElementById('consensus-ring-fill').setAttribute('stroke-dashoffset', circumference * (1 - pct));
  }

  function consensusPillHTML(consensus) {
    if (!consensus || consensus.state === 'none') {
      return `<div class="cpill cpill-none"><span class="cpill-label">No consensus</span>` +
             `<span class="cpill-val cpill-dash">—</span></div>`;
    }
    const stateClass = consensus.state === 'unanimous' ? 'cpill-good' : 'cpill-real';
    const label = consensus.state === 'unanimous' ? 'Unanimous'
                : consensus.state === 'split' ? 'Split' : 'Consensus';
    const vals = consensus.values
      .map(v => `<span class="cpill-val">${escapeHtml(String(v))}</span>`)
      .join('');
    return `<div class="cpill ${stateClass}"><span class="cpill-label">${label}</span>${vals}</div>`;
  }

  function renderStage() {
    const cards = document.getElementById('stage-cards');
    const status = document.getElementById('stage-status');
    const action = document.getElementById('stage-action');
    const pill = document.getElementById('consensus-pill');
    const votedCount = state.room.players.filter(p => p.vote).length;
    const totalCount = state.room.players.length;
    const me = state.room.players.find(p => p.id === state.playerId);
    const isHost = me?.isHost;
    const revealed = state.room.revealed;
    const consensus = state.room.consensus;

    // Top zone: voting status while voting, consensus pill once revealed.
    if (revealed) {
      status.style.display = 'none';
      pill.innerHTML = consensusPillHTML(consensus);
      pill.classList.add('show');
    } else {
      status.style.display = '';
      status.innerHTML = `<span class="count">${votedCount}</span> of ${totalCount} voted`;
      pill.classList.remove('show');
    }

    cards.innerHTML = state.room.players.map((p, i) => {
      const color = COLORS[p.color];
      const isWaiting = !p.vote || p.vote === null;
      const displayVote = revealed ? (p.vote || '—') : '';
      const flipClass = revealed ? 'flip' : '';
      const delay = revealed ? `transition-delay: ${i * 0.1}s` : '';
      const isMatch = revealed && consensus && consensus.values.includes(String(p.vote));
      return `
        <div class="stage-card" style="animation-delay:${i * 0.06}s">
          <div class="stage-card-inner ${flipClass}" style="${delay}">
            <div class="stage-card-front ${isWaiting && !revealed ? 'sc-waiting' : ''}" style="background:${isWaiting && !revealed ? '' : color}">
              <span class="sc-init">${isWaiting && !revealed ? '?' : p.name[0].toUpperCase()}</span>
            </div>
            <div class="stage-card-back ${isMatch ? 'match' : ''}" style="color:${color}">
              <div class="sc-inlay"></div>
              <div class="sc-val-area"><span class="sc-value">${displayVote}</span></div>
              <div class="sc-name-bar" style="background:${color}"><span class="sc-name" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</span></div>
            </div>
          </div>
        </div>
      `;
    }).join('');

    if (revealed) {
      if (isHost) {
        action.innerHTML = '<button class="btn-new-round" onclick="newRound()">Start New Round</button>';
      } else {
        action.innerHTML = '<span class="stage-hint">Waiting for host to start new round...</span>';
      }
    } else {
      if (isHost) {
        const allVoted = votedCount === totalCount && totalCount > 0;
        action.innerHTML = `<button class="btn-reveal ${allVoted ? 'all-in' : ''}" onclick="reveal()" ${votedCount === 0 ? 'disabled style="opacity:0.5;cursor:default;"' : ''}>Reveal Cards</button>`;
      } else {
        action.innerHTML = '<span class="stage-hint">Waiting for host to reveal...</span>';
      }
    }
  }

  function renderHand() {
    const container = document.getElementById('hand-cards');
    const system = state.room.votingSystem;
    const locked = state.room.revealed;
    container.classList.toggle('hand-locked', !!locked);
    container.innerHTML = system.map(value => {
      const picked = state.myVote === value ? 'picked' : '';
      return `<div class="hand-card ${picked}" onclick="pickCard('${value}')">${value}</div>`;
    }).join('');
  }

  // ─── Action Functions ─────────────────────────────────────────────────────────
  function pickCard(value) {
    if (state.room.revealed) return;
    if (state.myVote === value) {
      state.myVote = null;
      send({ type: 'clear-vote' });
    } else {
      state.myVote = value;
      send({ type: 'vote', value });
    }
    renderHand();
  }

  function reveal() { send({ type: 'reveal' }); }
  function newRound() { send({ type: 'new-round' }); }
  function leaveRoom() {
    if (!confirm('Leave this room?')) return;
    send({ type: 'leave-room' });
    state.room = null;
    state.playerId = null;
    state.myVote = null;
    state.wasHost = false;
    navigate('/');
  }

  function copyInviteLink() {
    const url = `${location.origin}/${state.room.id}`;
    navigator.clipboard.writeText(url).then(() => {
      const btn = document.getElementById('btn-copy-link');
      const orig = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = orig; }, 1500);
    });
  }
  function copyRoomCode() {
    navigator.clipboard.writeText(state.room.id).then(() => {
      const btn = document.getElementById('room-code-display');
      const orig = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = orig; }, 1500);
    });
  }

  function changeColor(colorIndex) {
    send({ type: 'change-color', colorIndex });
  }

  function renderCountdown() {
    let overlay = document.getElementById('countdown-overlay');
    if (state.countdown) {
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'countdown-overlay';
        overlay.className = 'countdown-overlay';
        document.querySelector('.stage').appendChild(overlay);
      }
      overlay.innerHTML = `<div class="countdown-number">${state.countdown}</div><div class="countdown-label">${escapeHtml(state.countdownBy)} is revealing...</div>`;
      overlay.classList.add('show');
    } else if (overlay) {
      overlay.classList.remove('show');
    }
  }

  function showToast(message) {
    let toast = document.getElementById('toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'toast';
      toast.className = 'toast';
      document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function toggleColorPicker(event) {
    event.stopPropagation();
    const popover = document.getElementById('color-picker-popover');
    if (popover) popover.classList.toggle('show');
  }

  document.addEventListener('click', function() {
    const popover = document.getElementById('color-picker-popover');
    if (popover) popover.classList.remove('show');
  });

  // ─── Path Router + Init ───────────────────────────────────────────────────────
  // Routes: '/' = landing, '/CODE' = a room.
  function navigate(path) {
    if (location.pathname !== path) history.pushState(null, '', path);
    handleRoute();
  }

  function handleRoute() {
    const code = location.pathname.slice(1).toLowerCase();
    if (!code) {
      showLanding();
      return;
    }
    // Already in this room — just show it.
    if (state.room && state.room.id === code) {
      showGame();
      hideModals();
      return;
    }
    // In a different room — confirm before switching.
    if (state.room) {
      if (!confirm('Leave your current room to join a different one?')) {
        navigate(`/${state.room.id}`);
        return;
      }
      send({ type: 'leave-room' });
      state.room = null;
      state.playerId = null;
      state.myVote = null;
      state.wasHost = false;
    }
    // Not in this room yet — show the landing page with the join modal.
    showLanding();
    showJoinModal(code);
  }

  // Shuffle landing hero cards
  const heroContainer = document.querySelector('.landing-hero-cards');
  if (heroContainer) {
    const cards = [...heroContainer.children];
    for (let i = cards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    cards.forEach(c => heroContainer.appendChild(c));
  }

  window.addEventListener('popstate', handleRoute);
  connect();
  prefillPlayerName();
  handleRoute();
</script>
</body>
</html>
