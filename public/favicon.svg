<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Card 1: left tilt (sage) -->
  <rect x="5" y="6" width="14" height="20" rx="3" ry="3" fill="#6aad8c" transform="rotate(-15 12 16)"/>
  <rect x="7" y="8" width="10" height="16" rx="1.5" ry="1.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.7" transform="rotate(-15 12 16)"/>

  <!-- Card 2: center (periwinkle) -->
  <rect x="9" y="5" width="14" height="20" rx="3" ry="3" fill="#7b8fc7"/>
  <rect x="11" y="7" width="10" height="16" rx="1.5" ry="1.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.7"/>

  <!-- Card 3: right tilt (terracotta) -->
  <rect x="13" y="6" width="14" height="20" rx="3" ry="3" fill="#d4856a" transform="rotate(15 20 16)"/>
  <rect x="15" y="8" width="10" height="16" rx="1.5" ry="1.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.7" transform="rotate(15 20 16)"/>
</svg>
